[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigah-cliente"
version = "0.1.0"
description = "Cliente de la API de agenda SIGAH (Hospital Regional de Puerto Aldea)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
sigah = "sigah.cli:main"

[tool.setuptools]
packages = ["sigah"]
